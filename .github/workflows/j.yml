name: Delete All Tags & Releases

on:
  workflow_dispatch:          # 仅手动触发，防止误删
    inputs:
      confirm:
        description: '输入 DELETE 确认执行'
        required: true
        default: ''

permissions:
  contents: write             # 需要 write 权限来删除 release 和 tag

jobs:
  delete:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DELETE'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 拉取所有 tag

      - name: Delete all releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取所有 release ID 并逐个删除（含草稿和预发布）
          RELEASE_IDS=$(gh api repos/${{ github.repository }}/releases --paginate \
            --jq '.[].id')
          
          if [ -z "$RELEASE_IDS" ]; then
            echo "没有找到任何 Release"
          else
            for id in $RELEASE_IDS; do
              echo "删除 Release ID: $id"
              gh api -X DELETE repos/${{ github.repository }}/releases/$id
            done
          fi

      - name: Delete all remote tags
        run: |
          # 获取所有远程 tag 并删除
          git push origin --delete $(git tag -l) || echo "没有 tag 需要删除"

      - name: Delete all local tags (清理引用)
        run: |
          git tag -d $(git tag -l) || true
          # 清理远程剩余的引用（保险起见再检查一次）
          git ls-remote --tags origin | awk '{print $2}' | sed 's|refs/tags/||; s|\^{}$||' | sort -u | while read tag; do
            git push origin --delete "refs/tags/$tag" || true
          done
          echo "✅ 所有 tag 和 release 已删除"
